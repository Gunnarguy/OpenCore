name: OpenCorePhone
options:
  bundleIdPrefix: com.gunndamental
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OpenCore:
    path: ../..
targets:
  OpenCorePhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: OpenCore
        product: OpenCoreCompanion
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: OpenCore
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSFaceIDUsageDescription: "Unlock your paired OpenCore companion session to read your history from your Mac."
        NSLocalNetworkUsageDescription: "OpenCore connects only to your paired Mac over your Tailscale network."
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gunndamental.OpenCorePhone
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z3E334EXZD
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
